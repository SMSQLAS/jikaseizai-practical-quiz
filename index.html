<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自家製剤加算クイズ 実践編</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section id="startScreen" class="card screen active">
      <div class="badge">実践編</div>
      <h1>💊 自家製剤加算クイズ</h1>
      <p class="lead">薬価基準を実際に調べながら、同一剤形・同一規格の薬価収載品があるか確認してみましょう。</p>

      <div class="notice">
        <strong>このクイズの前提</strong>
        <p>問題文に特別な記載がない限り、薬学的に加工可能であり、薬価基準上の代替製剤の有無も確認済みとして考えてください。</p>
        <p>医師の指示、一包化との関係、製剤工程、算定区分など、実際の調剤場面を踏まえて判断します。</p>
      </div>

      <p class="reference-link">📘 通知・疑義解釈・添付文書などを確認しながら解いてOK！</p>

      <p class="question-count">全20問</p>
      <button id="startButton" class="primary-button" type="button">開始する</button>
    </section>

    <section id="quizScreen" class="card screen">
      <div class="progress-row">
        <span id="progressText">問題1 / 20</span>
        <span id="scoreText">正解 0</span>
      </div>
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>

      <div id="questionText" class="question"></div>

      <div id="answerButtons" class="answer-buttons">
        <button id="trueButton" class="answer-button true-button" type="button">算定できる</button>
        <button id="falseButton" class="answer-button false-button" type="button">算定できない</button>
      </div>

      <div id="feedback" class="feedback hidden" aria-live="polite"></div>
      <button id="nextButton" class="primary-button hidden" type="button">次の問題へ</button>
    </section>

    <section id="resultScreen" class="card screen">
      <div class="badge">クイズ終了！</div>
      <h2>お疲れさまでした😊</h2>
      <p id="resultScore" class="result-score"></p>

      <form id="resultForm" novalidate>
        <label>
          店舗名
          <input id="storeName" name="storeName" type="text" autocomplete="organization" required>
        </label>

        <label>
          名前
          <input id="userName" name="userName" type="text" autocomplete="name" required>
        </label>

        <fieldset>
          <legend>このクイズの難易度はどうでしたか？</legend>
          <label class="radio-label"><input type="radio" name="difficulty" value="簡単" required> 簡単</label>
          <label class="radio-label"><input type="radio" name="difficulty" value="ちょうどいい"> ちょうどいい</label>
          <label class="radio-label"><input type="radio" name="difficulty" value="難しい"> 難しい</label>
        </fieldset>

        <p id="formError" class="form-error hidden"></p>
        <button id="sendButton" class="primary-button" type="submit">結果を送信する</button>
      </form>

      <div id="sendStatus" class="send-status hidden" aria-live="polite"></div>
      <button id="retryButton" class="secondary-button" type="button" disabled>もう一度する</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
